<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Timetable · Easy Edit</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#A5B9A3;color:#28372F;padding:18px}.shell{max-width:1500px;margin:auto;background:#E3E5DF;border:1px solid #C1CEC0;border-radius:23px;padding:24px 34px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:24px;margin:0}.muted{color:#506A58;font-size:12px}.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.day{min-width:0}.dayname{text-align:center;font-size:12px;letter-spacing:1px;color:#43594B;margin-bottom:12px}.dayname.off{color:#758578}.stack{display:flex;flex-direction:column;gap:12px}.lesson{width:100%;min-height:78px;text-align:left;border:1px solid transparent;border-radius:14px;padding:12px 11px;color:#26352E;cursor:pointer;overflow-wrap:anywhere;transition:border-color .15s,transform .15s}.lesson:hover{border-color:#6C8D74;transform:translateY(-1px)}.name{font-size:14px;font-weight:650}.time{font-size:12px;color:#415348;margin-top:8px}.room{font-size:11px;color:#53675B;margin-top:6px}.add{width:100%;border:1px dashed #91A895;background:#E9EDE6;color:#4A7054;border-radius:13px;padding:12px 4px;cursor:pointer}.add:hover{background:#D3E0D3}.foot{font-size:11px;color:#586E5E;margin-top:18px}.dialog{border:1px solid #A6BBA9;background:#E6EBE3;color:#293A30;border-radius:20px;padding:0;width:min(450px,calc(100% - 26px));box-shadow:0 25px 90px #0005}.dialog::backdrop{background:#000b}.inside{padding:22px}.dialog h2{font-size:19px;margin:0 0 18px}.field{display:block;margin-bottom:14px}.field span{display:block;color:#4F6755;font-size:12px;margin-bottom:7px}input,select{width:100%;background:#F4F5F0;color:#293A30;border:1px solid #A9B9AA;border-radius:10px;padding:12px;font-size:14px}input:focus,select:focus{outline:2px solid #91b39b}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.btn{border:1px solid #506253;border-radius:10px;background:#D2DED1;color:#263A2C;padding:11px 14px;cursor:pointer;font-size:13px}.primary{background:#8EAE92;color:#172B1B;border-color:#8EAE92;font-weight:700}.danger{color:#9C4141;border-color:#CBA9A9;margin-right:auto}.hint{font-size:12px;color:#586F5C;line-height:1.6;margin-top:13px}@media(max-width:900px){body{padding:12px}.shell{padding:20px 16px}.week{gap:8px}.lesson{min-height:74px;border-radius:12px;padding:9px 5px}.name{font-size:11px}.time,.room{font-size:9px}.dayname{font-size:10px}.add{font-size:11px;padding:10px 0}}@media(max-width:500px){.week{gap:3px}.name{font-size:9px}.time,.room{font-size:8px}.lesson{padding:8px 3px;min-height:70px}.dayname{font-size:9px}.head h1{font-size:20px}.muted{font-size:10px}}
.color-options{display:flex;gap:12px;flex-wrap:wrap;align-items:center;padding:7px 2px 5px}.color-dot{width:34px;height:34px;border-radius:50%;border:2px solid #F4F5F0;box-shadow:0 0 0 1px #A8B6A9;cursor:pointer;position:relative;transition:transform .15s,box-shadow .15s}.color-dot:hover{transform:scale(1.1)}.color-dot.selected{box-shadow:0 0 0 3px #405E48}.color-dot.selected:after{content:'✓';position:absolute;inset:0;display:grid;place-items:center;color:#26352E;font-weight:800;font-size:17px}@media(max-width:500px){.color-options{gap:9px}.color-dot{width:30px;height:30px}}
</style></head><body><main class="shell"><div class="week" id="week"></div><p class="foot">수업 카드를 누르면 수정할 수 있어요. 각 요일의 + 버튼으로 수업을 추가하세요.</p></main><dialog class="dialog" id="dialog"><form class="inside" id="form"><h2 id="dialogTitle">수업 추가</h2><label class="field"><span>요일</span><select id="day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option></select></label><label class="field"><span>과목명</span><input id="course" placeholder="예: Biology" required maxlength="60"></label><label class="field"><span>수업 시간</span><input id="time" placeholder="예: 09:00 – 10:30" required maxlength="50"></label><label class="field"><span>강의실 (선택)</span><input id="room" placeholder="예: Room 201" maxlength="50"></label><label class="field"><span>카드 색상</span><div class="color-options" id="colorOptions" role="radiogroup" aria-label="카드 색상"></div></label><div class="actions"><button class="btn danger" type="button" id="delete" hidden>삭제</button><button class="btn" type="button" id="cancel">취소</button><button class="btn primary" type="submit">저장하기</button></div><div class="hint">변경 내용은 현재 브라우저에 저장돼요. 파일을 다른 기기에서 열거나 노션에 게시하면 자동 공유되지는 않아요.</div></form></dialog><script>
const names=['MON','TUE','WED','THU','FRI'];const colors={sage:'#91B9A1',blue:'#A9C9DE',lavender:'#D1BBDD',sand:'#E6D0A5',rose:'#E8BAC0',slate:'#B5C5CE',peach:'#E7BBA6'};const sample=[{day:0,name:'Biology',time:'09:00 – 10:30',room:'',color:'sage'},{day:0,name:'Chemistry',time:'13:00 – 14:30',room:'',color:'blue'},{day:1,name:'Anatomy',time:'09:00 – 10:30',room:'',color:'lavender'},{day:1,name:'English',time:'11:00 – 12:30',room:'',color:'blue'},{day:2,name:'Lab',time:'09:00 – 11:00',room:'',color:'sand'},{day:2,name:'Biology',time:'13:00 – 14:30',room:'',color:'sage'},{day:3,name:'Chemistry',time:'09:00 – 10:30',room:'',color:'blue'},{day:3,name:'Anatomy',time:'13:00 – 14:30',room:'',color:'lavender'},{day:4,name:'English',time:'10:00 – 11:30',room:'',color:'blue'},{day:4,name:'Lab',time:'13:00 – 15:00',room:'',color:'sand'}];let data;try{data=JSON.parse(localStorage.getItem('weekly_timetable_easy_v2'));if(!Array.isArray(data))data=structuredClone(sample)}catch(e){data=structuredClone(sample)}const week=document.getElementById('week'),dialog=document.getElementById('dialog');const colorOptions=document.getElementById('colorOptions');let selectedColor='sage';function chooseColor(key){selectedColor=key;colorOptions.querySelectorAll('button').forEach(b=>{const active=b.dataset.color===key;b.setAttribute('aria-checked',String(active));b.classList.toggle('selected',active)})}Object.entries(colors).forEach(([key,hex])=>{const b=document.createElement('button');b.type='button';b.className='color-dot';b.dataset.color=key;b.style.backgroundColor=hex;b.setAttribute('role','radio');b.setAttribute('aria-label',key);b.title=key;b.onclick=()=>chooseColor(key);colorOptions.append(b)});let current=-1;function node(tag,cls,t){const e=document.createElement(tag);if(cls)e.className=cls;if(t!==undefined)e.textContent=t;return e}function save(){try{localStorage.setItem('weekly_timetable_easy_v2',JSON.stringify(data))}catch(e){}render()}function render(){week.replaceChildren();names.forEach((day,d)=>{const col=node('section','day');col.append(node('div','dayname',day));const stack=node('div','stack');data.forEach((x,i)=>{if(x.day!==d)return;const card=node('button','lesson');card.type='button';card.style.background=colors[x.color]||colors.sage;card.append(node('div','name',x.name),node('div','time',x.time));if(x.room)card.append(node('div','room',x.room));card.onclick=()=>open(i,d);stack.append(card)});const add=node('button','add','+');add.type='button';add.setAttribute('aria-label',day+' 수업 추가');add.onclick=()=>open(-1,d);stack.append(add);col.append(stack);week.append(col)})}function open(index,day){current=index;const x=index<0?{day,name:'',time:'',room:'',color:'sage'}:data[index];document.getElementById('dialogTitle').textContent=index<0?'수업 추가':'수업 수정';document.getElementById('day').value=x.day;document.getElementById('course').value=x.name;document.getElementById('time').value=x.time;document.getElementById('room').value=x.room||'';chooseColor(colors[x.color]?x.color:'sage');document.getElementById('delete').hidden=index<0;dialog.showModal()}document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('delete').onclick=()=>{if(current>=0){data.splice(current,1);save();dialog.close()}};document.getElementById('form').onsubmit=e=>{e.preventDefault();const x={day:Number(document.getElementById('day').value),name:document.getElementById('course').value.trim(),time:document.getElementById('time').value.trim(),room:document.getElementById('room').value.trim(),color:selectedColor};if(!x.name||!x.time)return;if(current<0)data.push(x);else data[current]=x;save();dialog.close()};render();
</script></body></html>
