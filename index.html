<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Timetable · Easy Edit</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111412;color:#e8ece9;padding:20px}.shell{max-width:1500px;margin:auto;background:#1b1e1c;border:1px solid #2d3430;border-radius:26px;padding:25px 20px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:26px}h1{font-size:24px;margin:0}.muted{color:#a1b4a6;font-size:12px}.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.day{min-width:0}.dayname{text-align:center;font-size:12px;letter-spacing:1px;color:#adbcaf;margin-bottom:12px}.dayname.off{color:#969e98}.stack{display:flex;flex-direction:column;gap:8px}.lesson{width:100%;min-height:104px;text-align:left;border:1px solid transparent;border-radius:17px;padding:14px 11px;color:#f2f3f1;cursor:pointer;overflow-wrap:anywhere;transition:border-color .15s,transform .15s}.lesson:hover{border-color:#b4c4b7;transform:translateY(-1px)}.name{font-size:14px;font-weight:650}.time{font-size:12px;color:#d0d8d1;margin-top:8px}.room{font-size:11px;color:#bec9bf;margin-top:6px}.add{width:100%;border:1px dashed #4b5b50;background:#242c26;color:#afc7b4;border-radius:13px;padding:12px 4px;cursor:pointer}.add:hover{background:#2c3a30}.foot{font-size:11px;color:#93a498;margin-top:22px}.dialog{border:1px solid #4b5d50;background:#222a24;color:#f0f2ee;border-radius:20px;padding:0;width:min(450px,calc(100% - 26px));box-shadow:0 25px 90px #000b}.dialog::backdrop{background:#000b}.inside{padding:22px}.dialog h2{font-size:19px;margin:0 0 18px}.field{display:block;margin-bottom:14px}.field span{display:block;color:#c2d0c4;font-size:12px;margin-bottom:7px}input,select{width:100%;background:#151c17;color:#f4f5f3;border:1px solid #506253;border-radius:10px;padding:12px;font-size:14px}input:focus,select:focus{outline:2px solid #91b39b}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.btn{border:1px solid #506253;border-radius:10px;background:#303b32;color:#f3f5f1;padding:11px 14px;cursor:pointer;font-size:13px}.primary{background:#8fb59a;color:#132016;border-color:#8fb59a;font-weight:700}.danger{color:#e8aaaa;border-color:#704a4a;margin-right:auto}.hint{font-size:12px;color:#a5b8a8;line-height:1.6;margin-top:13px}@media(max-width:900px){body{padding:8px}.shell{padding:18px 8px}.week{gap:4px}.lesson{min-height:90px;border-radius:12px;padding:9px 5px}.name{font-size:11px}.time,.room{font-size:9px}.dayname{font-size:10px}.add{font-size:11px;padding:10px 0}}@media(max-width:500px){.week{gap:3px}.name{font-size:9px}.time,.room{font-size:8px}.lesson{padding:8px 3px;min-height:80px}.dayname{font-size:9px}.head h1{font-size:20px}.muted{font-size:10px}}
</style></head><body><main class="shell"><header class="head"><h1>Weekly Timetable</h1><span class="muted">SEMESTER 01</span></header><div class="week" id="week"></div><p class="foot">수업 카드를 누르면 수정할 수 있어요. 각 요일의 + 버튼으로 수업을 추가하세요.</p></main><dialog class="dialog" id="dialog"><form class="inside" id="form"><h2 id="dialogTitle">수업 추가</h2><label class="field"><span>요일</span><select id="day"><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option><option value="6">Sunday</option></select></label><label class="field"><span>과목명</span><input id="course" placeholder="예: Biology" required maxlength="60"></label><label class="field"><span>수업 시간</span><input id="time" placeholder="예: 09:00 – 10:30" required maxlength="50"></label><label class="field"><span>강의실 (선택)</span><input id="room" placeholder="예: Room 201" maxlength="50"></label><label class="field"><span>카드 색상</span><select id="color"><option value="sage">세이지 그린</option><option value="blue">더스티 블루</option><option value="lavender">라벤더</option><option value="sand">샌드 베이지</option><option value="rose">더스티 로즈</option><option value="slate">슬레이트</option></select></label><div class="actions"><button class="btn danger" type="button" id="delete" hidden>삭제</button><button class="btn" type="button" id="cancel">취소</button><button class="btn primary" type="submit">저장하기</button></div><div class="hint">변경 내용은 현재 브라우저에 저장돼요. 파일을 다른 기기에서 열거나 노션에 게시하면 자동 공유되지는 않아요.</div></form></dialog><script>
const names=['MON','TUE','WED','THU','FRI','SAT','SUN'];const colors={sage:'#344f46',blue:'#34485e',lavender:'#50485e',sand:'#555142',rose:'#5d454e',slate:'#404a47'};const sample=[{day:0,name:'Biology',time:'09:00 – 10:30',room:'',color:'sage'},{day:0,name:'Chemistry',time:'13:00 – 14:30',room:'',color:'blue'},{day:1,name:'Anatomy',time:'09:00 – 10:30',room:'',color:'lavender'},{day:1,name:'English',time:'11:00 – 12:30',room:'',color:'blue'},{day:2,name:'Lab',time:'09:00 – 11:00',room:'',color:'sand'},{day:2,name:'Biology',time:'13:00 – 14:30',room:'',color:'sage'},{day:3,name:'Chemistry',time:'09:00 – 10:30',room:'',color:'blue'},{day:3,name:'Anatomy',time:'13:00 – 14:30',room:'',color:'lavender'},{day:4,name:'English',time:'10:00 – 11:30',room:'',color:'blue'},{day:4,name:'Lab',time:'13:00 – 15:00',room:'',color:'sand'}];let data;try{data=JSON.parse(localStorage.getItem('weekly_timetable_easy_v2'));if(!Array.isArray(data))data=structuredClone(sample)}catch(e){data=structuredClone(sample)}const week=document.getElementById('week'),dialog=document.getElementById('dialog');let current=-1;function node(tag,cls,t){const e=document.createElement(tag);if(cls)e.className=cls;if(t!==undefined)e.textContent=t;return e}function save(){try{localStorage.setItem('weekly_timetable_easy_v2',JSON.stringify(data))}catch(e){}render()}function render(){week.replaceChildren();names.forEach((day,d)=>{const col=node('section','day');col.append(node('div','dayname'+(d>4?' off':''),day));const stack=node('div','stack');data.forEach((x,i)=>{if(x.day!==d)return;const card=node('button','lesson');card.type='button';card.style.background=colors[x.color]||colors.sage;card.append(node('div','name',x.name),node('div','time',x.time));if(x.room)card.append(node('div','room',x.room));card.onclick=()=>open(i,d);stack.append(card)});const add=node('button','add','+');add.type='button';add.setAttribute('aria-label',day+' 수업 추가');add.onclick=()=>open(-1,d);stack.append(add);col.append(stack);week.append(col)})}function open(index,day){current=index;const x=index<0?{day,name:'',time:'',room:'',color:'sage'}:data[index];document.getElementById('dialogTitle').textContent=index<0?'수업 추가':'수업 수정';document.getElementById('day').value=x.day;document.getElementById('course').value=x.name;document.getElementById('time').value=x.time;document.getElementById('room').value=x.room||'';document.getElementById('color').value=x.color;document.getElementById('delete').hidden=index<0;dialog.showModal()}document.getElementById('cancel').onclick=()=>dialog.close();document.getElementById('delete').onclick=()=>{if(current>=0&&confirm('이 수업을 삭제할까요?')){data.splice(current,1);save();dialog.close()}};document.getElementById('form').onsubmit=e=>{e.preventDefault();const x={day:Number(document.getElementById('day').value),name:document.getElementById('course').value.trim(),time:document.getElementById('time').value.trim(),room:document.getElementById('room').value.trim(),color:document.getElementById('color').value};if(!x.name||!x.time)return;if(current<0)data.push(x);else data[current]=x;save();dialog.close()};render();
</script></body></html>
